name = "nscc_litellm"
description = "NSCC PBS SWE-bench smoke run through a local LiteLLM provider proxy."
output_dir = "runs/nscc_litellm"
seeds = [42]

[benchmark]
name = "swebench"
profile = "profiles/benchmarks/swebench/phase0.json"

[harness]
name = "openclaw"
profile = "profiles/harnesses/openclaw_swebench.json"

[model]
profile = "profiles/models/minimax_m2_7.json"

[serving]
profile = "profiles/serving/litellm/minimax_global.json"

[deployment]
profile = "profiles/deployments/nscc_pbs_cpu.toml"

[limits]
max_instances = 1
