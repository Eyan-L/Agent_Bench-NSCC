name = "nscc_qwen38_roadmapbench_subagent_subset10"
description = "Ten high-fanout RoadmapBench tasks with matched OpenClaw structure, Qwen3.8-27B, and SGLang on NSCC."
output_dir = "runs/nscc_qwen38_roadmapbench_subagent_subset10"
seeds = [42]

[telemetry]
spans_html = true

[benchmark]
name = "terminal_bench"
profile = "profiles/benchmarks/terminal_bench/roadmapbench_subagent_subset10.json"

[harness]
name = "openclaw"
profile = "profiles/harnesses/openclaw_roadmapbench_dr_matched.yaml"

[model]
profile = "profiles/models/qwen38_27b_nscc.json"

[serving]
profile = "profiles/serving/sglang/nscc_qwen38_tp4.yaml"

[deployment]
profile = "profiles/deployments/nscc_pbs_4gpu.toml"

[limits]
max_workers = 1
