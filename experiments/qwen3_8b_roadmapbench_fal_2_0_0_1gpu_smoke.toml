name = "qwen3_8b_roadmapbench_fal_2_0_0_1gpu_smoke"
description = "RoadmapBench Falcon 2.0.0 natural fan-out smoke copied from the formal Roadmap OpenClaw chain and adapted for Qwen3-8B on one NSCC GPU."
output_dir = "runs/qwen3_8b_roadmapbench_fal_2_0_0_1gpu_smoke"
seeds = [42]

[telemetry]
spans_html = true

[benchmark]
name = "terminal_bench"
profile = "profiles/benchmarks/roadmap/roadmapbench_fal_2_0_0_1gpu_smoke.json"

[harness]
name = "openclaw"
profile = "profiles/harnesses/openclaw_roadmapbench.yaml"

[model]
profile = "profiles/models/qwen3_8b.json"

[serving]
profile = "profiles/serving/sglang/nscc_tp1.yaml"

[deployment]
profile = "profiles/deployments/nscc_pbs_1gpu.toml"

[limits]
max_workers = 1
