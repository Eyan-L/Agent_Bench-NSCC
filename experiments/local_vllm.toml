name = "local_vllm"
description = "Local Docker SWE-bench smoke run with vLLM serving."
output_dir = "runs/local_vllm"
seeds = [42]

[benchmark]
name = "swebench"
profile = "profiles/benchmarks/swebench/phase0.json"

[harness]
name = "openclaw"
profile = "profiles/harnesses/openclaw_swebench.yaml"

[model]
profile = "profiles/models/qwen35_9b.json"

[serving]
profile = "profiles/serving/vllm/default.yaml"

[deployment]
profile = "profiles/deployments/local_docker.toml"

[limits]
max_instances = 1
