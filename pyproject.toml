[project]
name = "bench-platform"
version = "0.1.0"
description = "Unified agent benchmark platform (eval + stress) on shared vLLM/sglang backend"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "anthropic>=0.18.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["eval*", "tests*"]
