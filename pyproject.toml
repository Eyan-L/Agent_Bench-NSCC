[project]
name = "bench-platform"
version = "0.1.0"
description = "Unified agent benchmark platform (eval + stress) on shared vLLM/sglang backend"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.optional-dependencies]
local = ["psutil>=5.9.0", "pynvml>=11.5.0", "requests>=2.31.0"]
nscc = ["pyyaml>=6.0", "requests>=2.31.0"]
ccds = ["pyyaml>=6.0", "requests>=2.31.0"]
openclaw = ["requests>=2.31.0"]
openhands = ["requests>=2.31.0"]
hermes = ["requests>=2.31.0"]
analysis = ["pyarrow>=14.0.0", "pandas>=2.0.0", "numpy>=1.24.0", "scipy>=1.11.0"]
legacy = [
    "anthropic>=0.18.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
    "pynvml>=11.5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
]
dev = [
    "anthropic>=0.18.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
    "pynvml>=11.5.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["agent_bench*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
