name: Fix one-off Roadmap timing workflow

on:
  push:
    paths:
      - '.github/workflows/fix-oneoff-roadmap-phase-timing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix generated test string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/oneoff-roadmap-phase-timing.yml')
          text = path.read_text()
          old = "text += r'''\\n\\ndef test_child_runtime_timing_and_unmaterialized_spawn_are_distinct"
          new = "text += '''\\n\\ndef test_child_runtime_timing_and_unmaterialized_spawn_are_distinct"
          if text.count(old) != 1:
              raise SystemExit(f'expected one raw-test anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-oneoff-roadmap-phase-timing.yml
          git add .github/workflows/oneoff-roadmap-phase-timing.yml
          git commit -m "Fix Roadmap timing workflow test generation"
          git push origin HEAD:master
