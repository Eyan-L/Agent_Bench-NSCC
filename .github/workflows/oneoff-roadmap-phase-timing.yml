name: One-off Roadmap phase timing instrumentation

on:
  push:
    paths:
      - '.github/workflows/oneoff-roadmap-phase-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal Roadmap timing instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Persist the promoted agent-wall metric without changing legacy duration_seconds.
          path = 'agent_bench/core/manifest.py'
          replace_once(
              path,
              '    duration_seconds: Optional[float] = None\n    \n    exit_code: Optional[int] = None\n',
              '    duration_seconds: Optional[float] = None\n'
              '    # OpenClaw logical execution only: initial parent dispatch through\n'
              '    # lifecycle completion/workspace quiescence. Excludes candidate freeze\n'
              '    # and verifier time; duration_seconds retains its legacy meaning.\n'
              '    agent_execution_seconds: Optional[float] = None\n'
              '    phase_timing: Optional[dict[str, Any]] = None\n'
              '    \n    exit_code: Optional[int] = None\n',
          )
          replace_once(
              path,
              '            "duration_seconds": self.duration_seconds,\n            "exit_code": self.exit_code,\n',
              '            "duration_seconds": self.duration_seconds,\n'
              '            "agent_execution_seconds": self.agent_execution_seconds,\n'
              '            "phase_timing": self.phase_timing,\n'
              '            "exit_code": self.exit_code,\n',
          )
          replace_once(
              path,
              '            duration_seconds=data.get("duration_seconds"),\n            exit_code=data.get("exit_code"),\n',
              '            duration_seconds=data.get("duration_seconds"),\n'
              '            agent_execution_seconds=data.get("agent_execution_seconds"),\n'
              '            phase_timing=data.get("phase_timing"),\n'
              '            exit_code=data.get("exit_code"),\n',
          )

          # 2) Reuse the existing OpenClaw step timer as the authoritative agent wall time.
          path = 'agent_bench/benchmarks/conditions/openclaw_agent.py'
          replace_once(
              path,
              '            step_end_ns = time.time_ns()\n\n        # diagnostics-otel uses BatchSpanProcessor under the hood. Spans only\n',
              '            step_end_ns = time.time_ns()\n\n'
              '        # This existing step boundary is the clean agent-latency boundary:\n'
              '        # initial parent dispatch -> benchmark lifecycle completion. For\n'
              '        # RoadmapBench the lifecycle hook returns only after all agent writers\n'
              '        # are quiesced, so failed spawn/announce waits remain real agent cost\n'
              '        # while setup, candidate freeze and verifier work stay outside it.\n'
              '        phase_timing = {\n'
              '            "agent_execution_start_ns": step_start_ns,\n'
              '            "agent_execution_end_ns": step_end_ns,\n'
              '            "agent_execution_seconds": (step_end_ns - step_start_ns) / 1e9,\n'
              '        }\n\n'
              '        # diagnostics-otel uses BatchSpanProcessor under the hood. Spans only\n',
          )
          replace_once(
              path,
              '        patch_text = self._collect_artifacts(\n'
              '            container_id, self._env_info, run_dir, workspace_root,\n'
              '        ) or ""\n'
              '        patch_path = run_dir / "candidate.patch"\n'
              '        patch_path.write_text(patch_text)\n',
              '        candidate_freeze_start_ns = time.time_ns()\n'
              '        patch_text = self._collect_artifacts(\n'
              '            container_id, self._env_info, run_dir, workspace_root,\n'
              '        ) or ""\n'
              '        patch_path = run_dir / "candidate.patch"\n'
              '        patch_path.write_text(patch_text)\n'
              '        candidate_freeze_end_ns = time.time_ns()\n'
              '        phase_timing.update({\n'
              '            "candidate_freeze_start_ns": candidate_freeze_start_ns,\n'
              '            "candidate_freeze_end_ns": candidate_freeze_end_ns,\n'
              '            "candidate_freeze_seconds": (\n'
              '                candidate_freeze_end_ns - candidate_freeze_start_ns\n'
              '            ) / 1e9,\n'
              '        })\n',
          )
          replace_once(
              path,
              '            "agent_lifecycle": agent_lifecycle,\n            **measurement,\n',
              '            "agent_lifecycle": agent_lifecycle,\n'
              '            "agent_execution_seconds": phase_timing["agent_execution_seconds"],\n'
              '            "phase_timing": phase_timing,\n'
              '            **measurement,\n',
          )

          # 3) Persist timing in the manifest and time the verifier separately.
          path = 'agent_bench/runtime/driver.py'
          replace_once(
              path,
              '        lifecycle_verifier_error = (\n'
              '            _roadmap_lifecycle_verifier_error(result)\n'
              '            if is_roadmapbench else None\n'
              '        )\n\n'
              '        if lifecycle_verifier_error:\n',
              '        phase_timing = result.get("phase_timing")\n'
              '        if not isinstance(phase_timing, dict):\n'
              '            phase_timing = {}\n'
              '            result["phase_timing"] = phase_timing\n'
              '        agent_start_ns = phase_timing.get("agent_execution_start_ns")\n'
              '        if isinstance(agent_start_ns, int) and manifest.wall_start_ns:\n'
              '            phase_timing["pre_agent_seconds"] = max(\n'
              '                0.0, (agent_start_ns - manifest.wall_start_ns) / 1e9\n'
              '            )\n\n'
              '        lifecycle_verifier_error = (\n'
              '            _roadmap_lifecycle_verifier_error(result)\n'
              '            if is_roadmapbench else None\n'
              '        )\n\n'
              '        if lifecycle_verifier_error:\n',
          )
          replace_once(
              path,
              '        elif skip_patch_gate or (patch_path.exists() and patch_path.stat().st_size > 0):\n'
              '            verdict = harness.run_tests(\n'
              '                container_id=container_id,\n'
              '                instance_id=run_config.instance_id,\n'
              '                workspace_root=env_info["workspace_root"],\n'
              '                timeout_seconds=run_config.wall_clock_budget_seconds,\n'
              '                patch=patch_path.read_text() if patch_path.exists() else "",\n'
              '                run_id=run_id,\n'
              '                instance_data=instance_data,\n'
              '                run_dir=run_dir,\n'
              '            )\n',
              '        elif skip_patch_gate or (patch_path.exists() and patch_path.stat().st_size > 0):\n'
              '            verifier_start_ns = time.time_ns()\n'
              '            try:\n'
              '                verdict = harness.run_tests(\n'
              '                    container_id=container_id,\n'
              '                    instance_id=run_config.instance_id,\n'
              '                    workspace_root=env_info["workspace_root"],\n'
              '                    timeout_seconds=run_config.wall_clock_budget_seconds,\n'
              '                    patch=patch_path.read_text() if patch_path.exists() else "",\n'
              '                    run_id=run_id,\n'
              '                    instance_data=instance_data,\n'
              '                    run_dir=run_dir,\n'
              '                )\n'
              '            finally:\n'
              '                verifier_end_ns = time.time_ns()\n'
              '                phase_timing.update({\n'
              '                    "verifier_start_ns": verifier_start_ns,\n'
              '                    "verifier_end_ns": verifier_end_ns,\n'
              '                    "verifier_seconds": (\n'
              '                        verifier_end_ns - verifier_start_ns\n'
              '                    ) / 1e9,\n'
              '                })\n',
          )
          replace_once(
              path,
              '        manifest.agent_lifecycle = verdict.get("agent_lifecycle")\n        manifest.verifier_status = verdict.get("verifier_status")\n',
              '        manifest.agent_lifecycle = verdict.get("agent_lifecycle")\n'
              '        manifest.agent_execution_seconds = result.get("agent_execution_seconds")\n'
              '        manifest.phase_timing = result.get("phase_timing")\n'
              '        manifest.verifier_status = verdict.get("verifier_status")\n',
          )

          # 4) Child timestamp provenance + per-child runtime, using durable state
          #    first and transcript bounds as an explicitly labelled fallback.
          path = 'agent_bench/benchmarks/conditions/openclaw_measurement.py'
          replace_once(path, 'import re\n', 'import re\nimport time\n')
          replace_once(
              path,
              '    return sources\n\n\ndef _append(\n',
              '''    return sources\n\n\ndef _entry_time(entry: dict, fields: tuple[str, ...]) -> tuple[int, str]:\n    for field in fields:\n        timestamp_ns = _timestamp_ns(entry.get(field))\n        if timestamp_ns:\n            return timestamp_ns, field\n    return 0, ""\n\n\ndef _transcript_time_bounds(path: Path) -> tuple[int, int]:\n    if not path.is_file():\n        return 0, 0\n    first = 0\n    last = 0\n    try:\n        lines = path.read_text(errors="replace").splitlines()\n    except OSError:\n        return 0, 0\n    for line in lines:\n        try:\n            item = json.loads(line)\n        except json.JSONDecodeError:\n            continue\n        message = item.get("message") or {}\n        timestamp_ns = _timestamp_ns(message.get("timestamp") or item.get("timestamp"))\n        if not timestamp_ns:\n            continue\n        first = timestamp_ns if not first else min(first, timestamp_ns)\n        last = max(last, timestamp_ns)\n    return first, last\n\n\ndef _child_start_time(entry: dict, transcript_first_ns: int) -> tuple[int, str, str]:\n    timestamp_ns, field = _entry_time(\n        entry, ("startedAt", "started_at", "createdAt", "created_at")\n    )\n    if timestamp_ns:\n        quality = "session_state" if field in {"startedAt", "started_at"} else "session_state_inferred"\n        return timestamp_ns, field, quality\n    if transcript_first_ns:\n        return transcript_first_ns, "transcript_first_event", "transcript_inferred"\n    return 0, "", "missing"\n\n\ndef _child_terminal_time(entry: dict, transcript_last_ns: int) -> tuple[int, str, str]:\n    timestamp_ns, field = _entry_time(\n        entry,\n        (\n            "endedAt", "ended_at", "completedAt", "completed_at",\n            "finishedAt", "finished_at",\n        ),\n    )\n    if timestamp_ns:\n        return timestamp_ns, field, "session_state"\n    timestamp_ns, field = _entry_time(entry, ("updatedAt", "updated_at"))\n    if timestamp_ns:\n        return timestamp_ns, field, "session_state_inferred"\n    if transcript_last_ns:\n        return transcript_last_ns, "transcript_last_event", "transcript_inferred"\n    return 0, "", "missing"\n\n\ndef _child_state_time(entry: dict, transcript_last_ns: int) -> tuple[int, str, str]:\n    timestamp_ns, field = _entry_time(\n        entry, ("updatedAt", "updated_at", "lastActivityAt", "last_activity_at")\n    )\n    if timestamp_ns:\n        return timestamp_ns, field, "session_state"\n    if transcript_last_ns:\n        return transcript_last_ns, "transcript_last_event", "transcript_inferred"\n    return 0, "", "missing"\n\n\ndef _append(\n''',
          )
          replace_once(
              path,
              '    index = _session_index(sessions_dir)\n    events: list[dict] = []\n\n    for path, session_key, entry in _session_sources(sessions_dir):\n',
              '    index = _session_index(sessions_dir)\n'
              '    events: list[dict] = []\n'
              '    session_bounds: dict[str, tuple[int, int]] = {}\n\n'
              '    for path, session_key, entry in _session_sources(sessions_dir):\n',
          )
          replace_once(
              path,
              '        heartbeat_turn = False\n        try:\n            lines = path.read_text(errors="replace").splitlines()\n',
              '        heartbeat_turn = False\n'
              '        transcript_first_ns = 0\n'
              '        transcript_last_ns = 0\n'
              '        try:\n'
              '            lines = path.read_text(errors="replace").splitlines()\n',
          )
          replace_once(
              path,
              '            item_type = item.get("type")\n            custom_type = str(item.get("customType") or "")\n',
              '            if timestamp_ns:\n'
              '                transcript_first_ns = (\n'
              '                    timestamp_ns if not transcript_first_ns\n'
              '                    else min(transcript_first_ns, timestamp_ns)\n'
              '                )\n'
              '                transcript_last_ns = max(transcript_last_ns, timestamp_ns)\n'
              '            item_type = item.get("type")\n'
              '            custom_type = str(item.get("customType") or "")\n',
          )
          replace_once(
              path,
              '    for session_key, entry in index.items():\n        if not isinstance(entry, dict) or not entry.get("spawnedBy"):\n',
              '        session_bounds[session_key] = (\n'
              '            transcript_first_ns, transcript_last_ns\n'
              '        )\n\n'
              '    for session_key, entry in index.items():\n'
              '        if not isinstance(entry, dict) or not entry.get("spawnedBy"):\n',
          )
          replace_once(
              path,
              '        _append(\n'
              '            events, timestamp_ns=0,\n'
              '            session_id=str(entry.get("sessionId") or ""),\n'
              '            session_key=str(session_key), role="child", event_type=event_type,\n'
              '            session_state=status, spawned_by=entry.get("spawnedBy"),\n'
              '        )\n'
              '    return events\n\n\ndef _gateway_events(run_dir: Path) -> list[dict]:\n',
              '''        _first_ns, last_ns = session_bounds.get(str(session_key), (0, 0))\n        if event_type in {"child_completion", "child_timeout"}:\n            source_ns, source_field, timestamp_quality = _child_terminal_time(\n                entry, last_ns\n            )\n        else:\n            source_ns, source_field, timestamp_quality = _child_state_time(\n                entry, last_ns\n            )\n        observed_ns = time.time_ns()\n        _append(\n            events, timestamp_ns=source_ns,\n            session_id=str(entry.get("sessionId") or ""),\n            session_key=str(session_key), role="child", event_type=event_type,\n            session_state=status, spawned_by=entry.get("spawnedBy"),\n            source_timestamp=_iso_from_ns(source_ns),\n            source_timestamp_ns=source_ns or None,\n            source_timestamp_field=source_field or None,\n            observed_timestamp=_iso_from_ns(observed_ns),\n            observed_timestamp_ns=observed_ns,\n            timestamp_quality=timestamp_quality,\n        )\n    return events\n\n\ndef _child_runtime_observability(run_dir: Path, agent_id: str) -> dict:\n    sessions_dir = run_dir / "conversation" / "sessions"\n    index = _session_index(sessions_dir) if sessions_dir.is_dir() else {}\n    children: dict[str, dict] = {}\n    intervals: list[tuple[int, int]] = []\n    terminal_states = {"done", "completed", "timeout", "timed_out"}\n    observed_ns = time.time_ns()\n\n    for session_key, entry in index.items():\n        if not isinstance(entry, dict) or not entry.get("spawnedBy"):\n            continue\n        session_key = str(session_key)\n        name = _session_file_name(entry)\n        transcript = sessions_dir / name if name else Path()\n        first_ns, last_ns = _transcript_time_bounds(transcript) if name else (0, 0)\n        start_ns, start_source, start_quality = _child_start_time(entry, first_ns)\n        status = str(entry.get("status") or "unknown").lower()\n        is_terminal = status in terminal_states\n        if is_terminal:\n            end_ns, end_source, end_quality = _child_terminal_time(entry, last_ns)\n        else:\n            end_ns, end_source, end_quality = 0, "", "missing"\n\n        runtime_seconds = None\n        if is_terminal and start_ns and end_ns and end_ns >= start_ns:\n            runtime_seconds = (end_ns - start_ns) / 1e9\n            intervals.append((start_ns, end_ns))\n\n        children[session_key] = {\n            "session_id": str(entry.get("sessionId") or "") or None,\n            "spawned_by": entry.get("spawnedBy"),\n            "status": status,\n            "start_timestamp": _iso_from_ns(start_ns),\n            "start_timestamp_ns": start_ns or None,\n            "start_timestamp_source": start_source or None,\n            "start_timestamp_quality": start_quality,\n            "terminal_timestamp": _iso_from_ns(end_ns),\n            "terminal_timestamp_ns": end_ns or None,\n            "terminal_timestamp_source": end_source or None,\n            "terminal_timestamp_quality": end_quality,\n            "observed_timestamp": _iso_from_ns(observed_ns),\n            "observed_timestamp_ns": observed_ns,\n            "runtime_seconds": runtime_seconds,\n        }\n\n    complete = [\n        child for child in children.values()\n        if child.get("runtime_seconds") is not None\n    ]\n    runtime_sum = sum(float(child["runtime_seconds"]) for child in complete)\n\n    union_ns = 0\n    if intervals:\n        merged: list[list[int]] = []\n        for start_ns, end_ns in sorted(intervals):\n            if not merged or start_ns > merged[-1][1]:\n                merged.append([start_ns, end_ns])\n            else:\n                merged[-1][1] = max(merged[-1][1], end_ns)\n        union_ns = sum(end - start for start, end in merged)\n\n    max_concurrent = 0\n    concurrent = 0\n    points = []\n    for start_ns, end_ns in intervals:\n        points.append((start_ns, 1))\n        points.append((end_ns, -1))\n    for _timestamp_ns_value, delta in sorted(points, key=lambda item: (item[0], item[1])):\n        concurrent += delta\n        max_concurrent = max(max_concurrent, concurrent)\n\n    union_seconds = union_ns / 1e9\n    return {\n        "child_session_count": len(children),\n        "child_runtime_complete_count": len(complete),\n        "child_runtime_by_session": children,\n        "child_sum_runtime_seconds": runtime_sum,\n        "child_union_active_seconds": union_seconds,\n        "child_parallel_overlap_seconds": max(0.0, runtime_sum - union_seconds),\n        "max_concurrent_children": max_concurrent,\n        "child_runtime_policy": {\n            "definition": (\n                "durable child start to durable terminal time; session state "\n                "timestamps preferred, transcript bounds explicitly labelled as inferred"\n            ),\n            "failed_spawn_runtime": None,\n        },\n    }\n\n\ndef _gateway_events(run_dir: Path) -> list[dict]:\n''',
          )
          replace_once(
              path,
              'def _runtime_observability(run_dir: Path, events: list[dict]) -> dict:\n    announce_timeouts = [\n',
              'def _runtime_observability(\n'
              '    run_dir: Path, events: list[dict], agent_id: str\n'
              ') -> dict:\n'
              '    child_timing = _child_runtime_observability(run_dir, agent_id)\n'
              '    spawn_attempt_count = sum(\n'
              '        event.get("event_type") == "spawn" for event in events\n'
              '    )\n'
              '    announce_timeouts = [\n',
          )
          replace_once(
              path,
              '    return {\n        "announce_attempt_count": len(announce_timeouts) + len(announces),\n',
              '    return {\n'
              '        **child_timing,\n'
              '        "spawn_attempt_count": spawn_attempt_count,\n'
              '        "unmaterialized_spawn_attempt_count": max(\n'
              '            0, spawn_attempt_count - child_timing["child_session_count"]\n'
              '        ),\n'
              '        "spawn_runtime_policy": (\n'
              '            "failed/unmaterialized spawn attempts remain in agent_execution_seconds "\n'
              '            "but never create child runtime"\n'
              '        ),\n'
              '        "announce_attempt_count": len(announce_timeouts) + len(announces),\n',
          )
          replace_once(
              path,
              '    runtime_observability = _runtime_observability(run_dir, events)\n',
              '    runtime_observability = _runtime_observability(\n'
              '        run_dir, events, agent_id\n'
              '    )\n',
          )

          # 5) Regression coverage for source-vs-observed child timing and failed spawn.
          tests = Path('tests/test_openclaw_measurement.py')
          text = tests.read_text()
          test_name = 'def test_child_runtime_timing_and_unmaterialized_spawn_are_distinct('
          if test_name not in text:
              text += r'''\n\ndef test_child_runtime_timing_and_unmaterialized_spawn_are_distinct(tmp_path):\n    sessions = tmp_path / "conversation" / "sessions"\n    sessions.mkdir(parents=True)\n    parent_key = "agent:roadmap_bench:main"\n    child_a = "agent:roadmap_bench:subagent:a"\n    child_b = "agent:roadmap_bench:subagent:b"\n    (sessions / "sessions.json").write_text(json.dumps({\n        parent_key: {\n            "sessionId": "parent-id",\n            "sessionFile": "parent.jsonl",\n            "status": "done",\n        },\n        child_a: {\n            "sessionId": "child-a-id",\n            "sessionFile": "child-a.jsonl",\n            "spawnedBy": parent_key,\n            "status": "done",\n            "createdAt": "2026-01-01T00:00:02Z",\n            "endedAt": "2026-01-01T00:00:05Z",\n        },\n        child_b: {\n            "sessionId": "child-b-id",\n            "sessionFile": "child-b.jsonl",\n            "spawnedBy": parent_key,\n            "status": "done",\n        },\n    }))\n    _write_jsonl(sessions / "parent.jsonl", [{\n        "type": "message",\n        "message": {\n            "role": "assistant",\n            "timestamp": "2026-01-01T00:00:01Z",\n            "stopReason": "toolUse",\n            "content": [\n                {"type": "toolCall", "id": "spawn-a", "name": "sessions_spawn", "arguments": {"task": "a"}},\n                {"type": "toolCall", "id": "spawn-b", "name": "sessions_spawn", "arguments": {"task": "b"}},\n                {"type": "toolCall", "id": "spawn-failed", "name": "sessions_spawn", "arguments": {"task": "never materialized"}},\n            ],\n        },\n    }])\n    _write_jsonl(sessions / "child-a.jsonl", [{\n        "type": "message",\n        "message": {\n            "role": "assistant",\n            "timestamp": "2026-01-01T00:00:04Z",\n            "stopReason": "stop",\n            "content": [{"type": "text", "text": "a done"}],\n        },\n    }])\n    _write_jsonl(sessions / "child-b.jsonl", [\n        {"type": "message", "message": {\n            "role": "assistant",\n            "timestamp": "2026-01-01T00:00:06Z",\n            "stopReason": "toolUse",\n            "content": [],\n        }},\n        {"type": "message", "message": {\n            "role": "assistant",\n            "timestamp": "2026-01-01T00:00:09Z",\n            "stopReason": "stop",\n            "content": [{"type": "text", "text": "b done"}],\n        }},\n    ])\n\n    result = build_openclaw_measurement(tmp_path, agent_id="roadmap_bench")\n    obs = result["runtime_observability"]\n\n    assert obs["spawn_attempt_count"] == 3\n    assert obs["child_session_count"] == 2\n    assert obs["unmaterialized_spawn_attempt_count"] == 1\n    assert obs["child_runtime_complete_count"] == 2\n    assert obs["child_runtime_by_session"][child_a]["runtime_seconds"] == 3.0\n    assert obs["child_runtime_by_session"][child_a]["start_timestamp_source"] == "createdAt"\n    assert obs["child_runtime_by_session"][child_a]["terminal_timestamp_source"] == "endedAt"\n    assert obs["child_runtime_by_session"][child_b]["runtime_seconds"] == 3.0\n    assert obs["child_runtime_by_session"][child_b]["start_timestamp_quality"] == "transcript_inferred"\n    assert obs["child_runtime_by_session"][child_b]["terminal_timestamp_quality"] == "transcript_inferred"\n    assert obs["child_sum_runtime_seconds"] == 6.0\n    assert obs["child_union_active_seconds"] == 6.0\n    assert obs["child_parallel_overlap_seconds"] == 0.0\n    assert obs["max_concurrent_children"] == 1\n\n    events = [\n        json.loads(line)\n        for line in (tmp_path / "trajectory.jsonl").read_text().splitlines()\n    ]\n    completions = {\n        event["session_key"]: event\n        for event in events\n        if event["event_type"] == "child_completion"\n    }\n    assert completions[child_a]["source_timestamp_field"] == "endedAt"\n    assert completions[child_a]["timestamp_quality"] == "session_state"\n    assert completions[child_a]["observed_timestamp_ns"] is not None\n    assert completions[child_b]["source_timestamp_field"] == "transcript_last_event"\n    assert completions[child_b]["timestamp_quality"] == "transcript_inferred"\n'''
              tests.write_text(text)
          PY

      - name: Validate syntax and measurement invariants
        shell: bash
        run: |
          python -m compileall -q \
            agent_bench/core/manifest.py \
            agent_bench/runtime/driver.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_measurement.py \
            tests/test_openclaw_measurement.py
          python - <<'PY'
          from pathlib import Path
          import json
          import tempfile
          from agent_bench.benchmarks.conditions.openclaw_measurement import build_openclaw_measurement

          source = Path('agent_bench/benchmarks/conditions/openclaw_agent.py').read_text()
          manifest = Path('agent_bench/core/manifest.py').read_text()
          driver = Path('agent_bench/runtime/driver.py').read_text()
          assert '"agent_execution_seconds": (step_end_ns - step_start_ns) / 1e9' in source
          assert 'candidate_freeze_seconds' in source
          assert 'agent_execution_seconds: Optional[float]' in manifest
          assert 'manifest.agent_execution_seconds = result.get("agent_execution_seconds")' in driver
          assert 'verifier_seconds' in driver

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              sessions = root / 'conversation' / 'sessions'
              sessions.mkdir(parents=True)
              parent = 'agent:roadmap_bench:main'
              child = 'agent:roadmap_bench:subagent:a'
              (sessions / 'sessions.json').write_text(json.dumps({
                  parent: {'sessionId': 'p', 'sessionFile': 'p.jsonl', 'status': 'done'},
                  child: {
                      'sessionId': 'c', 'sessionFile': 'c.jsonl', 'spawnedBy': parent,
                      'status': 'done', 'createdAt': '2026-01-01T00:00:02Z',
                      'endedAt': '2026-01-01T00:00:05Z',
                  },
              }))
              (sessions / 'p.jsonl').write_text(json.dumps({
                  'type': 'message', 'message': {
                      'role': 'assistant', 'timestamp': '2026-01-01T00:00:01Z',
                      'stopReason': 'toolUse', 'content': [
                          {'type': 'toolCall', 'id': 's1', 'name': 'sessions_spawn', 'arguments': {}},
                          {'type': 'toolCall', 'id': 's2', 'name': 'sessions_spawn', 'arguments': {}},
                      ],
                  },
              }) + '\n')
              (sessions / 'c.jsonl').write_text(json.dumps({
                  'type': 'message', 'message': {
                      'role': 'assistant', 'timestamp': '2026-01-01T00:00:04Z',
                      'stopReason': 'stop', 'content': [],
                  },
              }) + '\n')
              result = build_openclaw_measurement(root, agent_id='roadmap_bench')
              obs = result['runtime_observability']
              assert obs['spawn_attempt_count'] == 2
              assert obs['child_session_count'] == 1
              assert obs['unmaterialized_spawn_attempt_count'] == 1
              assert obs['child_runtime_by_session'][child]['runtime_seconds'] == 3.0
          PY

      - name: Commit instrumentation and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-roadmap-phase-timing.yml
          git add \
            agent_bench/core/manifest.py \
            agent_bench/runtime/driver.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_measurement.py \
            tests/test_openclaw_measurement.py
          git commit -m "Add Roadmap agent and child timing measurements"
          git push origin HEAD:master
