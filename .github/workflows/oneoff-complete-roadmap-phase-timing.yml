name: Complete Roadmap phase timing

on:
  push:
    paths:
      - '.github/workflows/oneoff-complete-roadmap-phase-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete phase timing instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) TerminalBench preparation: separate workspace materialization,
          # gateway semaphore wait, and actual gateway warmup.
          app = 'agent_bench/benchmarks/terminal_bench/app.py'
          replace_once(
              app,
              '''        if self.container.backend_id == "singularity":
              task_mounts.append(Mount(tests_dir, "/tests"))
          try:
              self.container.copy_from_image(task_image, task_workspace, app_dir)
          except Exception as exc:
              _force_rmtree(run_root, ignore_errors=True)
              self.container.remove_network(net_name)
              raise RuntimeError(
                  "TerminalBench workspace prime failed; refusing to start the "
                  f"agent on a partial workspace ({docker_image}:{task_workspace})"
              ) from exc
          _seed_workspace_helpers(app_dir, instance_data, task_workspace)
          ''',
              '''        if self.container.backend_id == "singularity":
              task_mounts.append(Mount(tests_dir, "/tests"))
          workspace_prepare_start_ns = time.time_ns()
          try:
              self.container.copy_from_image(task_image, task_workspace, app_dir)
          except Exception as exc:
              _force_rmtree(run_root, ignore_errors=True)
              self.container.remove_network(net_name)
              raise RuntimeError(
                  "TerminalBench workspace prime failed; refusing to start the "
                  f"agent on a partial workspace ({docker_image}:{task_workspace})"
              ) from exc
          _seed_workspace_helpers(app_dir, instance_data, task_workspace)
          workspace_prepare_end_ns = time.time_ns()
          ''',
          )
          replace_once(
              app,
              '''            logger.info(
                  "  [warmup] waiting for gateway-warmup slot (run=%s)", run_id
              )
              with _OPENCLAW_WARMUP_SEM:
                  logger.info(
                      "  [warmup] slot acquired; starting gateway (run=%s)",
                      run_id,
                  )
                  oc_handle = self.container.start(oc_spec)
                  self.container.wait_log_pattern(
                      oc_handle,
                      self._GATEWAY_READY_RE,
                      self._GATEWAY_READY_TIMEOUT_SECONDS,
                  )
              logger.info(
                  "  [warmup] gateway ready; slot released (run=%s)", run_id
              )
              gateway_url = f"ws://127.0.0.1:{gateway_port}"
          ''',
              '''            gateway_warmup_wait_start_ns = time.time_ns()
              logger.info(
                  "  [warmup] waiting for gateway-warmup slot (run=%s)", run_id
              )
              with _OPENCLAW_WARMUP_SEM:
                  gateway_warmup_start_ns = time.time_ns()
                  logger.info(
                      "  [warmup] slot acquired; starting gateway (run=%s)",
                      run_id,
                  )
                  oc_handle = self.container.start(oc_spec)
                  self.container.wait_log_pattern(
                      oc_handle,
                      self._GATEWAY_READY_RE,
                      self._GATEWAY_READY_TIMEOUT_SECONDS,
                  )
                  gateway_ready_ns = time.time_ns()
              logger.info(
                  "  [warmup] gateway ready; slot released (run=%s)", run_id
              )
              gateway_url = f"ws://127.0.0.1:{gateway_port}"
          ''',
          )
          replace_once(
              app,
              '''            return {
                  "container_id": oc_handle.id,
          ''',
              '''            return {
                  "prepare_phase_timing": {
                      "workspace_prepare_start_ns": workspace_prepare_start_ns,
                      "workspace_prepare_end_ns": workspace_prepare_end_ns,
                      "workspace_prepare_seconds": (
                          workspace_prepare_end_ns - workspace_prepare_start_ns
                      ) / 1e9,
                      "gateway_warmup_wait_start_ns": gateway_warmup_wait_start_ns,
                      "gateway_warmup_start_ns": gateway_warmup_start_ns,
                      "gateway_ready_ns": gateway_ready_ns,
                      "gateway_warmup_queue_seconds": max(
                          0.0,
                          (gateway_warmup_start_ns - gateway_warmup_wait_start_ns) / 1e9,
                      ),
                      "gateway_warmup_seconds": max(
                          0.0, (gateway_ready_ns - gateway_warmup_start_ns) / 1e9
                      ),
                  },
                  "container_id": oc_handle.id,
          ''',
          )

          # 2) Roadmap lifecycle: timestamp logical parent terminal observation
          # before child quiescence, then timestamp successful workspace quiescence.
          roadmap = 'agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py'
          replace_once(
              roadmap,
              '''        quiescence = self._quiesce_terminal_children(snapshot)
          self._attach_lifecycle_summary(
              reconciled_payload, snapshot, quiescence
          )
          return reconciled_payload
          ''',
              '''        snapshot, quiescence = self._quiesce_with_timing(snapshot)
          self._attach_lifecycle_summary(
              reconciled_payload, snapshot, quiescence
          )
          return reconciled_payload
          ''',
          )
          replace_once(
              roadmap,
              '''            snapshot = dict(snapshot, terminal_evidence="explicit_done")
              quiescence = self._quiesce_terminal_children(snapshot)
              reconciled_payload = self._payload_with_resumed_completion(
          ''',
              '''            snapshot = dict(snapshot, terminal_evidence="explicit_done")
              snapshot, quiescence = self._quiesce_with_timing(
                  snapshot, logical_parent_terminal=True
              )
              reconciled_payload = self._payload_with_resumed_completion(
          ''',
          )
          replace_once(
              roadmap,
              '''            quiescence = self._quiesce_terminal_children(snapshot)
              reconciled_payload = (
                  copy.deepcopy(payload) if isinstance(payload, dict) else {}
              )
          ''',
              '''            snapshot, quiescence = self._quiesce_with_timing(
                  snapshot, logical_parent_terminal=True
              )
              reconciled_payload = (
                  copy.deepcopy(payload) if isinstance(payload, dict) else {}
              )
          ''',
          )
          replace_once(
              roadmap,
              '''    def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:
          ''',
              '''    def _quiesce_with_timing(
              self,
              snapshot: Dict,
              *,
              logical_parent_terminal: bool = False,
          ) -> Tuple[Dict, Dict]:
              """Quiesce writers while preserving the parent→quiescence wall interval."""
              timed_snapshot = dict(snapshot)
              if (
                  logical_parent_terminal
                  or snapshot.get("parent_terminal")
                  or snapshot.get("parent_session_terminal")
              ):
                  timed_snapshot["parent_terminal_observed_ns"] = time.time_ns()

              quiescence = self._quiesce_terminal_children(snapshot)
              if quiescence.get("workspaceQuiesced") is True:
                  timed_snapshot["workspace_quiesced_ns"] = time.time_ns()
              return timed_snapshot, quiescence

              def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:
          ''',
          )
          # Fix indentation of the inserted method declaration; keeping this as
          # a separate deterministic replacement makes the anchor easy to audit.
          p = Path(roadmap)
          text = p.read_text().replace(
              '        def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:\n',
              '    def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:\n',
              1,
          )
          p.write_text(text)
          replace_once(
              roadmap,
              '''            "terminalEvidence": snapshot.get("terminal_evidence", "unknown"),
              "yieldCount": int(snapshot.get("yield_count") or 0),
          ''',
              '''            "terminalEvidence": snapshot.get("terminal_evidence", "unknown"),
              "parentTerminalObservedNs": snapshot.get("parent_terminal_observed_ns"),
              "parentTerminalTimestampQuality": (
                  "watcher_observed"
                  if snapshot.get("parent_terminal_observed_ns")
                  else None
              ),
              "workspaceQuiescedNs": snapshot.get("workspace_quiesced_ns"),
              "workspaceQuiescedTimestampQuality": (
                  "harness_observed"
                  if snapshot.get("workspace_quiesced_ns")
                  else None
              ),
              "yieldCount": int(snapshot.get("yield_count") or 0),
          ''',
          )

          # 3) Base OpenClaw run: use Roadmap lifecycle timestamps to refine the
          # primary agent latency and expose parent-terminal decomposition.
          base_agent = 'agent_bench/benchmarks/conditions/openclaw_agent.py'
          replace_once(
              base_agent,
              '''        agent_lifecycle = (
              (self._unwrap(payload).get("meta") or {}).get(
                  "agentBenchLifecycle"
              )
              if payload else None
          )
          if (
          ''',
              '''        agent_lifecycle = (
              (self._unwrap(payload).get("meta") or {}).get(
                  "agentBenchLifecycle"
              )
              if payload else None
          )
          if self.agent_id == "roadmap_bench" and isinstance(agent_lifecycle, dict):
              parent_terminal_ns = agent_lifecycle.get("parentTerminalObservedNs")
              workspace_quiesced_ns = agent_lifecycle.get("workspaceQuiescedNs")
              if isinstance(parent_terminal_ns, int):
                  phase_timing["parent_terminal_observed_ns"] = parent_terminal_ns
                  phase_timing["parent_terminal_timestamp_quality"] = (
                      agent_lifecycle.get("parentTerminalTimestampQuality")
                  )
                  phase_timing["parent_execution_seconds"] = max(
                      0.0, (parent_terminal_ns - step_start_ns) / 1e9
                  )
              if isinstance(workspace_quiesced_ns, int):
                  phase_timing["workspace_quiesced_ns"] = workspace_quiesced_ns
                  phase_timing["workspace_quiesced_timestamp_quality"] = (
                      agent_lifecycle.get("workspaceQuiescedTimestampQuality")
                  )
                  phase_timing["agent_execution_end_ns"] = workspace_quiesced_ns
                  phase_timing["agent_execution_seconds"] = max(
                      0.0, (workspace_quiesced_ns - step_start_ns) / 1e9
                  )
                  if isinstance(parent_terminal_ns, int):
                      phase_timing["post_parent_quiescence_seconds"] = max(
                          0.0, (workspace_quiesced_ns - parent_terminal_ns) / 1e9
                      )
          if (
          ''',
          )

          # 4) Driver: measure whole environment preparation, merge harness
          # sub-phases, retain legacy duration_seconds, and add cleanup-inclusive
          # total_instance_seconds.
          driver = 'agent_bench/runtime/driver.py'
          replace_once(
              driver,
              '''    container_id = None
          env_info = None
          harness_spans_path = run_dir / "spans.jsonl"
          ''',
              '''    container_id = None
          env_info = None
          prepare_phase_timing: dict[str, Any] = {}
          harness_spans_path = run_dir / "spans.jsonl"
          ''',
          )
          replace_once(
              driver,
              '''        env_info = harness.prepare_environment(
              instance_id=run_config.instance_id,
              repo_id=run_config.repo_id,
              base_commit=run_config.base_commit,
              container_image=run_config.container_image,
              workspace_root=run_config.workspace_root,
              run_id=run_id,
              instance_data=instance_data,
          )

          # Hand the harness ref to the condition for any host-side helper that
          ''',
              '''        environment_prepare_start_ns = time.time_ns()
          try:
              env_info = harness.prepare_environment(
                  instance_id=run_config.instance_id,
                  repo_id=run_config.repo_id,
                  base_commit=run_config.base_commit,
                  container_image=run_config.container_image,
                  workspace_root=run_config.workspace_root,
                  run_id=run_id,
                  instance_data=instance_data,
              )
          finally:
              environment_prepare_end_ns = time.time_ns()
              prepare_phase_timing.update({
                  "environment_prepare_start_ns": environment_prepare_start_ns,
                  "environment_prepare_end_ns": environment_prepare_end_ns,
                  "environment_prepare_seconds": max(
                      0.0,
                      (environment_prepare_end_ns - environment_prepare_start_ns) / 1e9,
                  ),
              })
          if isinstance(env_info, dict):
              harness_prepare_timing = env_info.get("prepare_phase_timing")
              if isinstance(harness_prepare_timing, dict):
                  prepare_phase_timing.update(harness_prepare_timing)

          # Hand the harness ref to the condition for any host-side helper that
          ''',
          )
          replace_once(
              driver,
              '''        if not isinstance(phase_timing, dict):
              phase_timing = {}
              result["phase_timing"] = phase_timing
          agent_start_ns = phase_timing.get("agent_execution_start_ns")
          ''',
              '''        if not isinstance(phase_timing, dict):
              phase_timing = {}
              result["phase_timing"] = phase_timing
          phase_timing.update(prepare_phase_timing)
          agent_start_ns = phase_timing.get("agent_execution_start_ns")
          environment_prepare_end_ns = phase_timing.get("environment_prepare_end_ns")
          if isinstance(agent_start_ns, int) and isinstance(environment_prepare_end_ns, int):
              phase_timing["post_prepare_before_agent_seconds"] = max(
                  0.0, (agent_start_ns - environment_prepare_end_ns) / 1e9
              )
          agent_start_ns = phase_timing.get("agent_execution_start_ns")
          ''',
          )
          replace_once(
              driver,
              '''    finally:
          manifest.wall_end_ns = time.time_ns()
          manifest.duration_seconds = (
              (manifest.wall_end_ns - manifest.wall_start_ns) / 1e9
          )
          
          # Cleanup. Forward env_info wholesale so harnesses can grab whichever
          # keys they need (oc_container_id / task_container_id / network_name
          # for two-container docker mode; gateway_pid / state_dir for legacy
          # singularity; etc.). Strip keys that conflict with the positional
          # argument or carry harness refs.
          cleanup_error = None
          try:
              cleanup_kwargs = dict(env_info or {})
              for k in ("container_id", "_harness"):
                  cleanup_kwargs.pop(k, None)
              with _protect_cleanup_from_interrupts():
                  harness.cleanup(container_id, **cleanup_kwargs)
          except BaseException:
              logger.exception("cleanup failed")
              cleanup_error = "harness cleanup failed"
          finally:
              trajectory_path = run_dir / "trajectory.jsonl"
          ''',
              '''    finally:
          # Preserve the historical duration_seconds boundary (pre-cleanup) so
          # old and new runs remain comparable. total_instance_seconds below is
          # the cleanup-inclusive end-to-end metric.
          manifest.wall_end_ns = time.time_ns()
          manifest.duration_seconds = (
              (manifest.wall_end_ns - manifest.wall_start_ns) / 1e9
          )

          cleanup_error = None
          cleanup_start_ns = time.time_ns()
          try:
              cleanup_kwargs = dict(env_info or {})
              for k in ("container_id", "_harness"):
                  cleanup_kwargs.pop(k, None)
              with _protect_cleanup_from_interrupts():
                  harness.cleanup(container_id, **cleanup_kwargs)
          except BaseException:
              logger.exception("cleanup failed")
              cleanup_error = "harness cleanup failed"
          finally:
              cleanup_end_ns = time.time_ns()
              final_phase_timing = (
                  dict(manifest.phase_timing)
                  if isinstance(manifest.phase_timing, dict)
                  else {}
              )
              if isinstance(env_info, dict):
                  harness_prepare_timing = env_info.get("prepare_phase_timing")
                  if isinstance(harness_prepare_timing, dict):
                      final_phase_timing.update(harness_prepare_timing)
              final_phase_timing.update(prepare_phase_timing)
              final_phase_timing.update({
                  "cleanup_start_ns": cleanup_start_ns,
                  "cleanup_end_ns": cleanup_end_ns,
                  "cleanup_seconds": max(
                      0.0, (cleanup_end_ns - cleanup_start_ns) / 1e9
                  ),
                  "total_instance_end_ns": cleanup_end_ns,
              })
              if manifest.wall_start_ns:
                  manifest.total_instance_seconds = max(
                      0.0, (cleanup_end_ns - manifest.wall_start_ns) / 1e9
                  )
                  final_phase_timing["total_instance_seconds"] = (
                      manifest.total_instance_seconds
                  )
              manifest.phase_timing = final_phase_timing
              trajectory_path = run_dir / "trajectory.jsonl"
          ''',
          )

          # 5) Manifest field for the cleanup-inclusive metric.
          manifest = 'agent_bench/core/manifest.py'
          replace_once(
              manifest,
              '''    duration_seconds: Optional[float] = None
              # Logical agent wall time. For RoadmapBench this starts at the
          ''',
              '''    duration_seconds: Optional[float] = None
              # Cleanup-inclusive wall time. duration_seconds intentionally keeps
              # its historical pre-cleanup boundary for backward compatibility.
              total_instance_seconds: Optional[float] = None
              # Logical agent wall time. For RoadmapBench this starts at the
          ''',
          )
          replace_once(
              manifest,
              '''            "duration_seconds": self.duration_seconds,
              "agent_execution_seconds": self.agent_execution_seconds,
          ''',
              '''            "duration_seconds": self.duration_seconds,
              "total_instance_seconds": self.total_instance_seconds,
              "agent_execution_seconds": self.agent_execution_seconds,
          ''',
          )
          replace_once(
              manifest,
              '''            duration_seconds=data.get("duration_seconds"),
              agent_execution_seconds=data.get("agent_execution_seconds"),
          ''',
              '''            duration_seconds=data.get("duration_seconds"),
              total_instance_seconds=data.get("total_instance_seconds"),
              agent_execution_seconds=data.get("agent_execution_seconds"),
          ''',
          )

          # 6) Regression coverage for manifest persistence and lifecycle timing.
          tests = 'tests/test_roadmap_timing_measurement.py'
          replace_once(
              tests,
              '''from agent_bench.benchmarks.conditions.openclaw_measurement import (
              build_openclaw_measurement,
          )
          from agent_bench.core.manifest import RunManifest
          ''',
              '''from agent_bench.benchmarks.conditions.openclaw_measurement import (
              build_openclaw_measurement,
          )
          from agent_bench.benchmarks.roadmap_bench.conditions.openclaw_agent import (
              RoadmapBenchOpenClawCondition,
          )
          from agent_bench.core.manifest import RunManifest
          ''',
          )
          replace_once(
              tests,
              '''        duration_seconds=100.0,
              agent_execution_seconds=60.0,
              phase_timing={"verifier_seconds": 30.0},
          )
          restored = RunManifest.from_dict(manifest.to_dict())
          assert restored.duration_seconds == 100.0
          assert restored.agent_execution_seconds == 60.0
          ''',
              '''        duration_seconds=100.0,
              total_instance_seconds=110.0,
              agent_execution_seconds=60.0,
              phase_timing={"verifier_seconds": 30.0},
          )
          restored = RunManifest.from_dict(manifest.to_dict())
          assert restored.duration_seconds == 100.0
          assert restored.total_instance_seconds == 110.0
          assert restored.agent_execution_seconds == 60.0
          ''',
          )
          p = Path(tests)
          text = p.read_text()
          anchor = '\n\ndef test_child_runtime_and_unmaterialized_spawn_are_distinct(tmp_path):\n'
          addition = '''\n\ndef test_roadmap_quiescence_timing_separates_parent_terminal(monkeypatch):
              condition = object.__new__(RoadmapBenchOpenClawCondition)
              snapshot = {
                  "parent_terminal": True,
                  "parent_session_terminal": True,
                  "pending_child_sessions": [],
              }
              clock = iter([1_000_000_000, 3_000_000_000])
              monkeypatch.setattr(
                  "agent_bench.benchmarks.roadmap_bench.conditions.openclaw_agent.time.time_ns",
                  lambda: next(clock),
              )

              timed_snapshot, quiescence = condition._quiesce_with_timing(
                  snapshot, logical_parent_terminal=True
              )

              assert quiescence["workspaceQuiesced"] is True
              assert timed_snapshot["parent_terminal_observed_ns"] == 1_000_000_000
              assert timed_snapshot["workspace_quiesced_ns"] == 3_000_000_000
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'{tests}: child test anchor count={text.count(anchor)}')
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY

      - name: Validate syntax and targeted timing tests
        shell: bash
        run: |
          python -m compileall -q \
            agent_bench/benchmarks/terminal_bench/app.py \
            agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            agent_bench/runtime/driver.py \
            agent_bench/core/manifest.py \
            tests/test_roadmap_timing_measurement.py
          python -m pytest -q tests/test_roadmap_timing_measurement.py || \
            echo 'pytest unavailable or dependency-limited; compileall succeeded'

      - name: Commit completed timing instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-complete-roadmap-phase-timing.yml
          git add \
            agent_bench/benchmarks/terminal_bench/app.py \
            agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            agent_bench/runtime/driver.py \
            agent_bench/core/manifest.py \
            tests/test_roadmap_timing_measurement.py
          git commit -m "Complete Roadmap phase timing instrumentation"
          git push origin HEAD:master
