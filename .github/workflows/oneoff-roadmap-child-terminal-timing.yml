name: Complete Roadmap child terminal timing states

on:
  push:
    paths:
      - '.github/workflows/oneoff-roadmap-child-terminal-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align child terminal states with Roadmap lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agent_bench/benchmarks/conditions/openclaw_measurement.py')
          text = path.read_text()
          old = '    terminal_states = {"done", "completed", "timeout", "timed_out"}\n'
          new = '''    terminal_states = {\n        "done", "completed", "failed", "error", "timeout", "timed_out",\n        "cancelled", "canceled",\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'terminal_states anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q agent_bench/benchmarks/conditions/openclaw_measurement.py
      - name: Commit terminal-state alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_bench/benchmarks/conditions/openclaw_measurement.py
          git commit -m "Align child runtime with Roadmap terminal states"
          git push origin HEAD:master
