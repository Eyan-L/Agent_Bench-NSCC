name: Run validated Roadmap timing instrumentation

on:
  push:
    paths:
      - '.github/workflows/oneoff-roadmap-phase-timing-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: python -m pip install -q pytest pyyaml

      - name: Apply and validate v2 instrumentation
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/oneoff-roadmap-phase-timing-v2.yml').read_text()
          )
          steps = workflow['jobs']['patch']['steps']
          wanted = {
              'Apply minimal Roadmap timing instrumentation',
              'Validate syntax and targeted behavior',
          }
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              subprocess.run(
                  ['bash', '-e', '-o', 'pipefail', '-c', step['run']],
                  check=True,
              )
          PY

      - name: Commit instrumentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            agent_bench/core/manifest.py \
            agent_bench/runtime/driver.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_measurement.py \
            tests/test_roadmap_timing_measurement.py
          git commit -m "Add Roadmap agent and child timing measurements"
          git push origin HEAD:master
