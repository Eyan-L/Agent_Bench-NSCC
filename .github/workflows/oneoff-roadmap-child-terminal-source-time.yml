name: Use terminal source time for all child terminal states

on:
  push:
    paths:
      - '.github/workflows/oneoff-roadmap-child-terminal-source-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align synthetic child timestamp source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agent_bench/benchmarks/conditions/openclaw_measurement.py')
          text = path.read_text()
          old = '''        if event_type in {"child_completion", "child_timeout"}:\n            source_ns, source_field, timestamp_quality = _child_terminal_time(\n                entry, last_ns\n            )\n        else:\n'''
          new = '''        if status in {\n            "done", "completed", "failed", "error", "timeout", "timed_out",\n            "cancelled", "canceled",\n        }:\n            source_ns, source_field, timestamp_quality = _child_terminal_time(\n                entry, last_ns\n            )\n        else:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'child source-time anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q agent_bench/benchmarks/conditions/openclaw_measurement.py
      - name: Commit timestamp alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_bench/benchmarks/conditions/openclaw_measurement.py
          git commit -m "Use terminal timestamps for child terminal states"
          git push origin HEAD:master
