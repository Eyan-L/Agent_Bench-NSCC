name: Roadmap lifecycle phase timing v4
on:
  push:
    paths: ['.github/workflows/oneoff-roadmap-lifecycle-phase-v4.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch lifecycle timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count={count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          roadmap = 'agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py'
          one(
              roadmap,
              '        quiescence = self._quiesce_terminal_children(snapshot)\n        self._attach_lifecycle_summary(\n            reconciled_payload, snapshot, quiescence\n        )\n        return reconciled_payload\n\n    def _reconcile_terminal_snapshot(\n',
              '        snapshot, quiescence = self._quiesce_with_timing(snapshot)\n        self._attach_lifecycle_summary(\n            reconciled_payload, snapshot, quiescence\n        )\n        return reconciled_payload\n\n    def _reconcile_terminal_snapshot(\n',
          )
          one(
              roadmap,
              '        if snapshot.get("done_text"):\n            snapshot = dict(snapshot, terminal_evidence="explicit_done")\n            quiescence = self._quiesce_terminal_children(snapshot)\n',
              '        if snapshot.get("done_text"):\n            snapshot = dict(snapshot, terminal_evidence="explicit_done")\n            snapshot, quiescence = self._quiesce_with_timing(\n                snapshot, logical_parent_terminal=True\n            )\n',
          )
          one(
              roadmap,
              '            snapshot = dict(\n                snapshot,\n                terminal_evidence="durable_session_terminal_assistant_stop",\n            )\n            quiescence = self._quiesce_terminal_children(snapshot)\n',
              '            snapshot = dict(\n                snapshot,\n                terminal_evidence="durable_session_terminal_assistant_stop",\n            )\n            snapshot, quiescence = self._quiesce_with_timing(\n                snapshot, logical_parent_terminal=True\n            )\n',
          )
          one(
              roadmap,
              '    def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:\n',
              '    def _quiesce_with_timing(\n        self,\n        snapshot: Dict,\n        *,\n        logical_parent_terminal: bool = False,\n    ) -> Tuple[Dict, Dict]:\n        """Timestamp logical parent terminal observation and workspace quiescence."""\n        timed_snapshot = dict(snapshot)\n        if (\n            logical_parent_terminal\n            or snapshot.get("parent_terminal")\n            or snapshot.get("parent_session_terminal")\n        ):\n            timed_snapshot["parent_terminal_observed_ns"] = time.time_ns()\n        quiescence = self._quiesce_terminal_children(snapshot)\n        if quiescence.get("workspaceQuiesced") is True:\n            timed_snapshot["workspace_quiesced_ns"] = time.time_ns()\n        return timed_snapshot, quiescence\n\n    def _quiesce_terminal_children(self, snapshot: Dict) -> Dict:\n',
          )
          one(
              roadmap,
              '            "terminalEvidence": snapshot.get("terminal_evidence", "unknown"),\n            "yieldCount": int(snapshot.get("yield_count") or 0),\n',
              '            "terminalEvidence": snapshot.get("terminal_evidence", "unknown"),\n            "parentTerminalObservedNs": snapshot.get("parent_terminal_observed_ns"),\n            "parentTerminalTimestampQuality": (\n                "watcher_observed"\n                if snapshot.get("parent_terminal_observed_ns")\n                else None\n            ),\n            "workspaceQuiescedNs": snapshot.get("workspace_quiesced_ns"),\n            "workspaceQuiescedTimestampQuality": (\n                "harness_observed"\n                if snapshot.get("workspace_quiesced_ns")\n                else None\n            ),\n            "yieldCount": int(snapshot.get("yield_count") or 0),\n',
          )

          base = 'agent_bench/benchmarks/conditions/openclaw_agent.py'
          old = (
              '        agent_lifecycle = (\n'
              '            (self._unwrap(payload).get("meta") or {}).get(\n'
              '                "agentBenchLifecycle"\n'
              '            )\n'
              '            if payload else None\n'
              '        )\n'
              '        if (\n'
          )
          new = (
              '        agent_lifecycle = (\n'
              '            (self._unwrap(payload).get("meta") or {}).get(\n'
              '                "agentBenchLifecycle"\n'
              '            )\n'
              '            if payload else None\n'
              '        )\n'
              '        if self.agent_id == "roadmap_bench" and isinstance(agent_lifecycle, dict):\n'
              '            parent_terminal_ns = agent_lifecycle.get("parentTerminalObservedNs")\n'
              '            workspace_quiesced_ns = agent_lifecycle.get("workspaceQuiescedNs")\n'
              '            if isinstance(parent_terminal_ns, int):\n'
              '                phase_timing["parent_terminal_observed_ns"] = parent_terminal_ns\n'
              '                phase_timing["parent_terminal_timestamp_quality"] = agent_lifecycle.get("parentTerminalTimestampQuality")\n'
              '                phase_timing["parent_execution_seconds"] = max(\n'
              '                    0.0, (parent_terminal_ns - step_start_ns) / 1e9\n'
              '                )\n'
              '            if isinstance(workspace_quiesced_ns, int):\n'
              '                phase_timing["workspace_quiesced_ns"] = workspace_quiesced_ns\n'
              '                phase_timing["workspace_quiesced_timestamp_quality"] = agent_lifecycle.get("workspaceQuiescedTimestampQuality")\n'
              '                phase_timing["agent_execution_end_ns"] = workspace_quiesced_ns\n'
              '                phase_timing["agent_execution_seconds"] = max(\n'
              '                    0.0, (workspace_quiesced_ns - step_start_ns) / 1e9\n'
              '                )\n'
              '                if isinstance(parent_terminal_ns, int):\n'
              '                    phase_timing["post_parent_quiescence_seconds"] = max(\n'
              '                        0.0, (workspace_quiesced_ns - parent_terminal_ns) / 1e9\n'
              '                    )\n'
              '        if (\n'
          )
          one(base, old, new)

          tests = 'tests/test_roadmap_timing_measurement.py'
          one(
              tests,
              'from agent_bench.core.manifest import RunManifest\n',
              'from agent_bench.benchmarks.roadmap_bench.conditions.openclaw_agent import (\n    RoadmapBenchOpenClawCondition,\n)\nfrom agent_bench.core.manifest import RunManifest\n',
          )
          one(
              tests,
              '        duration_seconds=100.0,\n        agent_execution_seconds=60.0,\n',
              '        duration_seconds=100.0,\n        total_instance_seconds=110.0,\n        agent_execution_seconds=60.0,\n',
          )
          one(
              tests,
              '    assert restored.duration_seconds == 100.0\n    assert restored.agent_execution_seconds == 60.0\n',
              '    assert restored.duration_seconds == 100.0\n    assert restored.total_instance_seconds == 110.0\n    assert restored.agent_execution_seconds == 60.0\n',
          )
          p = Path(tests)
          text = p.read_text()
          anchor = '\n\ndef test_child_runtime_and_unmaterialized_spawn_are_distinct(tmp_path):\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'{tests}: insertion anchor count={text.count(anchor)}')
          addition = '''

          def test_roadmap_quiescence_timing_separates_parent_terminal(monkeypatch):
              condition = object.__new__(RoadmapBenchOpenClawCondition)
              snapshot = {
                  "parent_terminal": True,
                  "parent_session_terminal": True,
                  "pending_child_sessions": [],
              }
              clock = iter([1_000_000_000, 3_000_000_000])
              monkeypatch.setattr(
                  "agent_bench.benchmarks.roadmap_bench.conditions.openclaw_agent.time.time_ns",
                  lambda: next(clock),
              )
              timed_snapshot, quiescence = condition._quiesce_with_timing(
                  snapshot, logical_parent_terminal=True
              )
              assert quiescence["workspaceQuiesced"] is True
              assert timed_snapshot["parent_terminal_observed_ns"] == 1_000_000_000
              assert timed_snapshot["workspace_quiesced_ns"] == 3_000_000_000
          '''
          addition = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in addition.splitlines()
          )
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          python -m compileall -q \
            agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            tests/test_roadmap_timing_measurement.py
          if python -c 'import pytest' 2>/dev/null; then
            python -m pytest -q tests/test_roadmap_timing_measurement.py
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-roadmap-lifecycle-phase-v4.yml
          git add \
            agent_bench/benchmarks/roadmap_bench/conditions/openclaw_agent.py \
            agent_bench/benchmarks/conditions/openclaw_agent.py \
            tests/test_roadmap_timing_measurement.py
          git commit -m "Complete Roadmap lifecycle phase timing"
          git push origin HEAD:master
