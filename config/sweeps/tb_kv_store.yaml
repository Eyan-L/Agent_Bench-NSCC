sweep_name: "tb_kv_store_grpc"
plan_version: "v1.0"

# Terminal-Bench 2 sweep, single task: kv-store-grpc.
# Loader: eval/benchmarks/terminal_bench/loader.py materializes instance_data
# from config/benchmarks/terminal_bench/<task_id>/.
# Harness: TerminalBenchHarness (auto-selected by driver when
# instance_data["benchmark"] == "terminal_bench").

model:
  name: "Qwen/Qwen3.6-35B-A3B"
  endpoint: "http://localhost:8000/v1"
  temperature: 0.0
  max_tokens: 4096

serving_configs:
  - config_id: "vllm-default"
    preset: "default"
    max_num_seqs: 128
    enable_prefix_caching: true
    additional_flags: {}

conditions:
  - condition_id: "tb_react"
    condition_type: "tb_react"
    description: "Multi-turn ReAct agent driving bash inside the TB task container"
    agent:
      max_steps: 20
      max_time_seconds: 900
      retry_limit: 1

seeds: [42]

instances:
  - "kv-store-grpc"

# repo_mapping is SWE-bench specific but the driver requires it; for TB we
# stuff in placeholders so RunConfig.compute_run_id stays deterministic.
# The TB harness ignores these fields.
repo_mapping:
  "kv-store-grpc":
    repo_id: "terminal-bench/kv-store-grpc"
    base_commit: "tb2"

# container_image is unused for TB instances — TerminalBenchHarness reads
# the docker image out of the per-task task.toml. Field still required by
# config.SweepConfig.
container_image: "alexgshaw/kv-store-grpc:20251031"
wall_clock_budget_seconds: 900
output_dir: "data/runs/tb_kv_store"

parallel_limit_gpu: 1
parallel_limit_cpu_cores: 8
