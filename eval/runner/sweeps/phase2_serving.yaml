sweep_name: "phase2_serving_sweep"
plan_version: "v1.0"

model:
  name: "claude-sonnet-4.6"
  endpoint: "vllm://localhost:8000/v1"
  temperature: 0.0
  max_tokens: 4096

# RQ3: serving configuration sweep
serving_configs:
  - config_id: "vllm-latency"
    preset: "latency"
    max_num_seqs: 8
    enable_prefix_caching: true
    additional_flags:
      scheduling_policy: "priority"
  
  - config_id: "vllm-throughput"
    preset: "throughput"
    max_num_seqs: 256
    enable_prefix_caching: true
    additional_flags:
      enable_expert_parallel: true
  
  - config_id: "vllm-context"
    preset: "context"
    max_num_seqs: 32
    enable_prefix_caching: true
    additional_flags:
      kv_cache_dtype: "fp8"

conditions:
  - condition_id: "openclaw_agent"
    condition_type: "openclaw_agent"
    description: "OpenClaw code agent (serving sweep for RQ3)"
    agent:
      max_steps: 500
      max_time_seconds: 1800
      retry_limit: 10
      tool_profile: "code-agent-minimal"
      allowed_tools:
        - "Read"
        - "Write"
        - "Edit"
        - "Bash"
        - "Glob"
        - "Grep"

seeds: [42]

# Subset of Verified for serving sweep
instances:
  # TODO: Fill in instance IDs (recommend ~100 instances)

repo_mapping:
  # TODO: Fill in repo mappings

container_image: "swebench/swe-bench:latest"
wall_clock_budget_seconds: 1800
output_dir: "data/runs/phase2_serving"

parallel_limit_gpu: 1
parallel_limit_cpu_cores: 8
