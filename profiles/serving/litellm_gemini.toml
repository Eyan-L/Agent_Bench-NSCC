[serving]
config_id = "litellm-gemini"
backend = "litellm"
preset = "gemini"

[serving.endpoint]
scheme = "http"
bind_host = "0.0.0.0"
client_host = "127.0.0.1"
port = 8000
path = "/v1"

[serving.proxy]
api_key = "sk-agent-bench-local"
num_workers = 4
agent_provider = "custom"

[serving.provider]
active = "gemini"

[serving.provider.providers.gemini]
name = "gemini"
api = "litellm"
api_key_env = "GEMINI_API_KEY"
model = "gemini/gemini-3.5-flash"

[serving.scheduler]
max_num_seqs = 128
enable_prefix_caching = false

[serving.additional_flags]
