# Default SGLang endpoint profile. Model context length comes from
# profiles/models/*.json. Runtime TP/CUDA defaults can be overridden via
# AB_SERVING_TENSOR_PARALLEL_SIZE, SGLANG_TP, AB_SERVING_CUDA_VISIBLE_DEVICES,
# SGLANG_CUDA_VISIBLE_DEVICES, or CUDA_VISIBLE_DEVICES.
serving:
  config_id: sglang-default
  backend: sglang
  preset: default
  serving_mode: docker
  image: lmsysorg/sglang:v0.5.12.post1-cu130
  endpoint:
    scheme: http
    bind_host: 0.0.0.0
    client_host: 127.0.0.1
    port: 8000
    path: /v1
  runtime:
    tensor_parallel_size: 1
    cuda_visible_devices: "0"
    gpu_mem_util: 0.85
    enable_hierarchical_cache: false
    hicache_size: 60
  scheduler:
    max_num_seqs: 128
    enable_prefix_caching: true
  additional_flags: {}
  extra_args: []
