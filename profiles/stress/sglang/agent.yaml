name: agent-example-sync
output_dir: experiment/{timestamp}_{trace_type}
sglang:
  launcher: single
  port: 30000
  cuda_visible_devices: 0,1
  model_path: Qwen/Qwen3-30B-A3B-Instruct-2507
  mem_fraction_static: 0.85
  page_size: 64
  enable_hierarchical_cache: false
  tool_call_parser: qwen
  extra_args: ''
  startup_timeout_sec: 900
loadgen:
  trace_type: agent
  max_inflight: 1024
  record_body: true
  agent:
    agent_dirs_json: agent_dirs/trace_search.json
    mode: attempt
    concurrent_agents: 10
    max_agents: 0
    response_output_dir: cache
    start_stagger: ''
    stagger_seed: 0
plots:
  enabled: true
  sm_trace: false
