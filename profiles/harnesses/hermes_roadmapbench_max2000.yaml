# Focused retry after glz-6.1.0 exhausted the standard 600 Hermes iterations.
# The Roadmap task wall-clock limit remains 7200 seconds.
harness: hermes
terminal_bench:
  agent_assets_dir: agent_bench/benchmarks/roadmap_bench/hermes/agents
  workspace_asset_files:
  - AGENTS.md
  - IDENTITY.md
  - TOOLS.md
  - BOOTSTRAP.md
telemetry:
  otel:
    enabled: true
hermes:
  run:
    max_turns: 2000
    terminal_timeout: 180
conditions:
- condition_id: hermes_agent
  condition_type: hermes_agent
  description: RoadmapBench Hermes agent with frozen Git candidate
  agent:
    max_steps: 2000
    max_time_seconds: 7200
