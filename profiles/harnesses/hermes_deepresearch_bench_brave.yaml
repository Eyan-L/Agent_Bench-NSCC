# Hermes DeepResearch-Bench harness. The agent reads /workspace/PROMPT.md and
# writes /workspace/report.md; the host-side RACE/FACT judge scores the report.
harness: hermes
telemetry:
  spans_html: true
  otel:
    enabled: true
    endpoint: http://localhost:4318
    protocol: http/json
    service_name: agent-bench-hermes
    traces: true
    metrics: false
    logs: false
hermes:
  run:
    max_turns: 120
    terminal_timeout: 300
evaluation:
  judge_provider: openai
  judge_model: openai-compatible
  pass_threshold: 0.5
conditions:
- condition_id: hermes_agent
  condition_type: hermes_agent
  description: Hermes Agent driving a DeepResearch-Bench task container (Brave key via env)
  agent:
    max_steps: 300
    max_time_seconds: 3000
    retry_limit: 5
