# Delegation exercise for smoke validation; task and verifier match Roadmap.
harness: codex
terminal_bench:
  agent_assets_dir: agent_bench/benchmarks/roadmap_bench/codex/agents
  workspace_asset_files:
  - AGENTS.md
  - IDENTITY.md
  - TOOLS.md
  - BOOTSTRAP.md
codex:
  upstream_api: chat_completions
  require_done_marker: true
  chat_template_kwargs:
    enable_thinking: false
  multi_agent: true
  max_subagents: 16
  max_spawn_depth: 1
  developer_instructions: |
    This is a subagent integration smoke on a roadmap with multiple substantial
    independent targets. As the parent lead, after a bounded initial repository
    inspection, invoke the available native spawn_agent tool for at least two
    independent workstreams before broad implementation. Give each child a
    concrete task, non-overlapping file ownership, and required validation.
    Keep another useful workstream or shared integration work for yourself and
    continue it while the children run. At dependency checkpoints, use the
    native wait_agent tool to obtain child results, review and integrate them,
    then validate the complete roadmap before replying DONE. Saying that you
    will delegate does not satisfy the delegation step. This parent-only
    instruction does not apply to a subagent: each child must complete its
    assigned bounded scope and return its result without spawning more agents.
conditions:
- condition_id: codex_agent
  condition_type: codex_agent
  description: RoadmapBench Codex smoke exercising early native delegation
  agent:
    max_time_seconds: 7200
