# Same Roadmap persona, task images and verifier as OpenClaw.
harness: codex
terminal_bench:
  agent_assets_dir: agent_bench/benchmarks/roadmap_bench/codex/agents
  workspace_asset_files:
  - AGENTS.md
  - IDENTITY.md
  - TOOLS.md
  - BOOTSTRAP.md
codex:
  upstream_api: chat_completions
  multi_agent: true
  max_subagents: 16
  max_spawn_depth: 1
conditions:
- condition_id: codex_agent
  condition_type: codex_agent
  description: RoadmapBench lead engineer using native Codex subagents
  agent:
    max_time_seconds: 7200
