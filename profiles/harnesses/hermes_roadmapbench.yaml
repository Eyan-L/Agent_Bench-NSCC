# RoadmapBench-specific Hermes profile; does not modify Terminal-Bench Hermes.
harness: hermes
roadmapbench: true
telemetry:
  spans_html: true
  otel:
    enabled: true
    endpoint: http://localhost:4318
    protocol: http/json
    service_name: agent-bench-hermes
    traces: true
    metrics: false
    logs: false
hermes:
  run:
    max_turns: 600
    terminal_timeout: 600
  delegation:
    max_concurrent_children: 16
    max_iterations: 600
    child_timeout_seconds: 7200
conditions:
- condition_id: hermes_agent
  condition_type: hermes_agent
  description: Roadmap lead engineer with native Hermes delegation
  agent:
    max_steps: 600
    max_time_seconds: 7200
    retry_limit: 5
