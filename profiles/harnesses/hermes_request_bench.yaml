# Hermes Request-Bench harness. Agent reads /workspace/PROMPT.md and writes /workspace/answer.md.
harness: hermes
hermes:
  run:
    max_turns: 20
    terminal_timeout: 180
conditions:
- condition_id: hermes_agent
  condition_type: hermes_agent
  description: Hermes Agent CLI answering a Request-Bench natural-language prompt
  agent:
    max_steps: 120
    max_time_seconds: 600
    retry_limit: 3
