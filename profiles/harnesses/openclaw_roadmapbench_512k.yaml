# RoadmapBench 512K persona on the shared Terminal-Bench container lifecycle.
# Keep this separate from the baseline Roadmap harness so 256K experiments stay immutable.
harness: openclaw
terminal_bench:
  agent_assets_dir: agent_bench/benchmarks/roadmap_bench/openclaw/agents
  skills_dir: agent_bench/benchmarks/roadmap_bench/openclaw/skills
  agent_prompt_file: AGENTS.md
  workspace_bootstrap_file: BOOTSTRAP.md
  workspace_asset_files:
  - AGENTS.md
  - IDENTITY.md
  - TOOLS.md
  - BOOTSTRAP.md
openclaw:
  gateway:
    mode: local
    bind: loopback
    auth:
      mode: token
      token:
        source: env
        provider: env
        id: OPENCLAW_GATEWAY_TOKEN
  diagnostics:
    enabled: true
    otel:
      enabled: true
      endpoint: http://localhost:4318
      protocol: http/protobuf
      serviceName: agent-bench-openclaw
      traces: true
      metrics: true
      logs: true
      sampleRate: 1
      flushIntervalMs: 20
    cacheTrace:
      enabled: true
      includeMessages: true
      includePrompt: true
      includeSystem: true
  tools:
    exec:
      host: gateway
      security: full
    alsoAllow:
    - sessions_list
    - sessions_history
    - sessions_send
    - sessions_spawn
    - sessions_yield
    - subagents
    - session_status
  skills:
    load:
      extraDirs:
      - /root/.openclaw/skills
  plugins:
    entries:
      vllm:
        enabled: true
      memory-core:
        enabled: true
      diagnostics-otel:
        enabled: true
  agents:
    defaults:
      workspace: /app
      # Long-context Roadmap runs can lose active coding state when a large
      # transcript is compacted to the small Pi default recent-history tail.
      # Preserve enough recent state to continue the task without replaying
      # already-settled checks. Use the same policy for both experiment arms.
      compaction:
        mode: default
        reserveTokens: 32768
        reserveTokensFloor: 32768
        keepRecentTokens: 65536
        recentTurnsPreserve: 12
        identifierPolicy: strict
        customInstructions: >-
          Preserve the active coding task state needed to continue without
          repeating work: files changed, tests already run and their results,
          commands and checks already executed and what they established,
          current failing tests, unresolved hypotheses, blockers, and the next
          concrete action. Preserve exact file paths, identifiers, function
          names, and error messages. Explicitly record repeated checks that
          already produced stable results so they are not rerun unless the
          workspace or relevant inputs changed.
      subagents:
        maxConcurrent: 4
        runTimeoutSeconds: 2400
    list:
    - id: roadmap_bench
      default: true
      name: roadmap-lead-engineer
conditions:
- condition_id: openclaw_agent
  condition_type: openclaw_agent
  description: RoadmapBench lead engineer with natural parallel fan-out
  agent:
    max_steps: 600
    max_time_seconds: 7200
    retry_limit: 5
